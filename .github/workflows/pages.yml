name: Publish research site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/audit_workspace.py'
      - 'src/gemsdoe54/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy rasterio
      - name: Refresh local data-audit feed
        run: |
          python scripts/audit_workspace.py --data-dir data --output docs/data/workspace-audit.json
          python scripts/build_feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

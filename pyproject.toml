[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemsdoe54"
version = "0.1.0"
description = "Auditable, gate-first research scaffold for the GEMS fault-detection challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "rasterio>=1.3,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "scikit-learn>=1.3"]
# scikit-learn is needed only by the learned-probability candidate (H3) and its test
ml = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
